<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-16px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.65; }
      }
      @keyframes sprintFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      .card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .card-2 { animation: floatFast 5s ease-in-out infinite 1s; }
      .card-3 { animation: floatSlow 7s ease-in-out infinite 2s; }
      .pulse-circle { animation: pulseGlow 4s ease-in-out infinite alternate; }
      .flow-path { stroke-dasharray: 8, 8; animation: sprintFlow 3s linear infinite; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="120" fill="#38bdf8" filter="url(#glow)" class="pulse-circle" opacity="0.25" />
  <circle cx="1050" cy="260" r="130" fill="#6366f1" filter="url(#glow)" class="pulse-circle" opacity="0.3" />

  <!-- Dynamic / Animated Flow Track in Background -->
  <path d="M 120 280 C 350 320, 500 240, 700 290 S 980 230, 1100 270" fill="none" stroke="url(#neonBlue)" stroke-width="2.5" class="flow-path" opacity="0.45" />

  <!-- Dynamic Background Kanban Cards (Floating Accents) -->
  <g class="card-1" opacity="0.75">
    <rect x="80" y="55" width="145" height="75" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="95" y="70" width="55" height="10" rx="5" fill="#38bdf8" opacity="0.8" />
    <rect x="95" y="90" width="105" height="6" rx="3" fill="#64748b" />
    <rect x="95" y="103" width="70" height="6" rx="3" fill="#475569" />
    <circle cx="195" cy="75" r="7" fill="#10b981" />
  </g>

  <g class="card-2" opacity="0.85">
    <rect x="975" y="60" width="155" height="85" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <rect x="990" y="75" width="60" height="10" rx="5" fill="#818cf8" opacity="0.9" />
    <rect x="990" y="96" width="120" height="6" rx="3" fill="#64748b" />
    <rect x="990" y="109" width="85" height="6" rx="3" fill="#475569" />
    <rect x="990" y="122" width="40" height="8" rx="4" fill="#38bdf8" opacity="0.4" />
    <circle cx="1095" cy="80" r="7" fill="#f59e0b" />
  </g>

  <g class="card-3" opacity="0.7">
    <rect x="995" y="210" width="140" height="75" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" />
    <rect x="1010" y="225" width="50" height="10" rx="5" fill="#34d399" opacity="0.8" />
    <rect x="1010" y="245" width="100" height="6" rx="3" fill="#64748b" />
    <rect x="1010" y="258" width="65" height="6" rx="3" fill="#475569" />
    <circle cx="1105" cy="230" r="7" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Badge Pill -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="url(#neonCyan)" stroke-width="1.5" />
    <circle cx="-112" cy="0" r="6" fill="#10b981" filter="url(#glow)" />
    <text x="5" y="5" fill="#f8fafc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      CURATED ECOSYSTEM • 2026
    </text>
  </g>

  <!-- Foreground Content: Main Title -->
  <text x="600" y="155" text-anchor="middle" class="main-title" font-size="44" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
    Awesome Mobile Agile Project Tracking
  </text>

  <!-- Foreground Content: Gradient Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="sub-title" font-size="21" fill="url(#neonBlue)" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.4))">
    Sprint Management, Offline Kanban &amp; Issue Tracking on iOS &amp; Android
  </text>

  <!-- Foreground Content: Tag Pills -->
  <g transform="translate(600, 245)">
    <!-- Pill 1 -->
    <rect x="-240" y="0" width="100" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="-190" y="18" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">📱 Native iOS</text>

    <!-- Pill 2 -->
    <rect x="-125" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="-67" y="18" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">🤖 Android APK</text>

    <!-- Pill 3 -->
    <rect x="5" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="62" y="18" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">⚡ Offline Sync</text>

    <!-- Pill 4 -->
    <rect x="135" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="192" y="18" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">🚀 Open Source</text>
  </g>

  <!-- Footer Tagline inside banner -->
  <text x="600" y="320" text-anchor="middle" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#64748b">
    Manage backlogs, daily standups, and burndown charts on-the-go from your smartphone
  </text>
</svg>
